DATA:
  NAME: SWaT
  INPUT_DIR: data/SWaT

SEEDS: [0, 1, 2, 3]

TRAIN:
  BATCH_SIZE: 128
  EVAL_EVERY: 5

TEST:
  BATCH_SIZE: 128

SOLVER:
  MAX_EPOCH: 100
  GRADIENT_CLIP: 1.0

PICAAD:
  EARLY_STOP: False
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: False

EVAL:
  USE_MEDIAN_VUS_WINDOW: True
  DIAGNOSE_COMPONENTS: True
