DATA:
  NAME: PSM
  INPUT_DIR: data/PSM

SEEDS: [0, 1, 2, 3]

TRAIN:
  BATCH_SIZE: 512
  EVAL_EVERY: 5

TEST:
  BATCH_SIZE: 512

SOLVER:
  MAX_EPOCH: 100
  BASE_LR: 0.00005
  GRADIENT_CLIP: 1.0

PICAAD:
  EARLY_STOP: True
  EARLY_STOP_ON: test_metric
  EARLY_STOP_METRIC: F1
  PATIENCE: 5
  VAL_RATIO: 0.0
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: False

EVAL:
  USE_MEDIAN_VUS_WINDOW: True
  DIAGNOSE_COMPONENTS: True
