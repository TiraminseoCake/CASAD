# Validation-protocol variant of swat_cf.yaml.
# Identical native settings (model, losses, PERM_PAIRS_PER_BATCH=0, CALIBRATE=False,
# USE_COUNTERFACTUAL=True, lr, epochs, warmup, batch). Only data path, VAL block and
# TRAIN.EVAL_EVERY differ. Requires Phase 1-B trainer support to train.
DATA:
  NAME: SWaT
  INPUT_DIR: data_npz/SWaT51   # this server: NPZ under data_npz/ (colleague path was data/<NAME>)

  EXPECTED_N: 51       # fail loudly on any non-51-channel export (no fallback/slicing/padding)

SEEDS: [0, 1, 2, 3]

TRAIN:
  BATCH_SIZE: 128
  EVAL_EVERY: 0        # no test-set evaluation during training under the validation protocol

TEST:
  BATCH_SIZE: 128

SOLVER:
  MAX_EPOCH: 80
  BASE_LR: 0.0005
  GRADIENT_CLIP: 1.0

PICAAD:
  INTERVENTION:
    PERM_PAIRS_PER_BATCH: 0
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: False
    USE_COUNTERFACTUAL: True
    CF_TOP_K: 15
    CF_FILL_VALUE: 0.0
    SCORE_GAMMA: 1.0

EVAL:
  USE_MEDIAN_VUS_WINDOW: True
  DIAGNOSE_COMPONENTS: True

VAL:
  ENABLE: True
  FRAC: 0.2
  SAVE_EVERY_EPOCH: False
  SAVE_EVERY_N: 0
