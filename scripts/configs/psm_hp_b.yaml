DATA:
  NAME: PSM
  INPUT_DIR: data/PSM

SEEDS: [0]

TRAIN:
  BATCH_SIZE: 512
  EVAL_EVERY: 5

TEST:
  BATCH_SIZE: 512

SOLVER:
  MAX_EPOCH: 80
  BASE_LR: 0.0001
  GRADIENT_CLIP: 1.0

PICAAD:
  L: 20
  TAU_MAX: 10
  LAG_WIN: 5
  D: 128
  HEADS: 8
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: False

EVAL:
  USE_MEDIAN_VUS_WINDOW: True
  DIAGNOSE_COMPONENTS: True
