DATA:
  NAME: SWaT
  INPUT_DIR: data/SWaT

SEEDS: [0, 1, 2, 3]
TRAIN:
  BATCH_SIZE: 128
SOLVER:
  MAX_EPOCH: 80
  BASE_LR: 0.0005
  GRADIENT_CLIP: 1.0

PICAAD:
  START_CLS_EPOCH: 9999
  START_WREF_EPOCH: 9999
  LAM_ROBUST: 0.0
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: False

EVAL:
  USE_MEDIAN_VUS_WINDOW: True
  DIAGNOSE_COMPONENTS: True
