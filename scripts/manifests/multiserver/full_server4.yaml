# Campaign cfval — FULL, server4 share (planning file; execution needs approval):
#   PSM seeds 0-3 + SMD entities 1..8 of the fixed list (run_parallel.SMD_ENTITIES order) x seeds 0-3.
# Disjoint from full_server8.yaml; together they cover all 120 training jobs.
name: cfval_full_server4
description: full share for the 4-GPU server (PSM x4 seeds, SMD machine-1-1..1-8 x4 seeds)
defaults:
  threads_per_job: 4
  dataloader_workers: 0
  prior_workers: 2
  eval: {ckpt_tags: [last, best_val], cf: both, calibrate: cfg, verify_native_parity: false}
train:
  - {dataset: PSM, config: scripts/configs/psm_cf_val.yaml, input_dir: PSM, entities: [PSM], seeds: [0, 1, 2, 3]}
  - dataset: SMD
    config: scripts/configs/smd_cf_val.yaml
    input_dir: SMD
    entities: [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8]
    seeds: [0, 1, 2, 3]
eval_only: []
