# P3 structural ablation - ks share, SMD 28 entities (stage 1).
# Protocol: docs/p3_structural_ablation_protocol.md (fixed before any P3 training).
# Arms (configs from scripts/make_p3_configs.py; only PRIOR.TYPE / PRIOR.RANDOMIZE / DYNAMIC_GRAPH differ):
#   a  PCMCI+ prior   n  no prior   r  sparsity/lag-matched random prior   d  dynamic correction removed
# Prediction-only objective for every arm; best_val (validation pred MAE) evaluated with CF and calibration off.
# Real-data training requires a separate approval (2026-10-12 decision): this manifest is for dry-run/verification.
name: p3_structural_smd_ks
description: >
  P3 stage 1, SMD all 28 entities: 4 arms x 28 entities x seeds 0-3 = 448 training jobs, 448 best_val evaluations (CF off).
defaults:
  threads_per_job: 4
  dataloader_workers: 0
  prior_workers: 2
  eval:
    # "off" MUST stay quoted (YAML 1.1 reads a bare off as boolean False).
    ckpt_tags: [best_val]
    cf: "off"
    calibrate: "off"
    verify_native_parity: false
train:
  - {dataset: SMD, config: scripts/configs/p3_structural/smd_p3_a.yaml, input_dir: SMD, entities: [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8, machine-2-1, machine-2-2, machine-2-3, machine-2-4, machine-2-5, machine-2-6, machine-2-7, machine-2-8, machine-2-9, machine-3-1, machine-3-2, machine-3-3, machine-3-4, machine-3-5, machine-3-6, machine-3-7, machine-3-8, machine-3-9, machine-3-10, machine-3-11], seeds: [0, 1, 2, 3]}
  - {dataset: SMD, config: scripts/configs/p3_structural/smd_p3_n.yaml, input_dir: SMD, entities: [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8, machine-2-1, machine-2-2, machine-2-3, machine-2-4, machine-2-5, machine-2-6, machine-2-7, machine-2-8, machine-2-9, machine-3-1, machine-3-2, machine-3-3, machine-3-4, machine-3-5, machine-3-6, machine-3-7, machine-3-8, machine-3-9, machine-3-10, machine-3-11], seeds: [0, 1, 2, 3]}
  - {dataset: SMD, config: scripts/configs/p3_structural/smd_p3_r.yaml, input_dir: SMD, entities: [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8, machine-2-1, machine-2-2, machine-2-3, machine-2-4, machine-2-5, machine-2-6, machine-2-7, machine-2-8, machine-2-9, machine-3-1, machine-3-2, machine-3-3, machine-3-4, machine-3-5, machine-3-6, machine-3-7, machine-3-8, machine-3-9, machine-3-10, machine-3-11], seeds: [0, 1, 2, 3]}
  - {dataset: SMD, config: scripts/configs/p3_structural/smd_p3_d.yaml, input_dir: SMD, entities: [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8, machine-2-1, machine-2-2, machine-2-3, machine-2-4, machine-2-5, machine-2-6, machine-2-7, machine-2-8, machine-2-9, machine-3-1, machine-3-2, machine-3-3, machine-3-4, machine-3-5, machine-3-6, machine-3-7, machine-3-8, machine-3-9, machine-3-10, machine-3-11], seeds: [0, 1, 2, 3]}
eval_only: []
