# Pilot: validation-protocol CF training, one seed per dataset (approved first scope).
# Epoch/LR/CF settings come from the referenced configs (not overridden here).
name: pilot_cfval
description: PSM seed0, SWaT51 seed0, SMD machine-1-1 seed0 with *_cf_val.yaml (VAL on, PERM=0, CALIBRATE=False, CF on)
defaults:
  threads_per_job: 4          # OMP/MKL/OPENBLAS threads per child process
  dataloader_workers: 0       # DATA_LOADER.NUM_WORKERS passed to main.py
  prior_workers: 1            # concurrent CPU PCMCI+ warmup jobs
  eval:
    ckpt_tags: [last, best_val]
    cf: both
    calibrate: cfg            # follows checkpoint config (CALIBRATE=False)
    verify_native_parity: false
train:
  - dataset: PSM
    config: scripts/configs/psm_cf_val.yaml
    input_dir: PSM            # relative to --data_root (default: <repo>/data_npz)
    entities: [PSM]
    seeds: [0]
  - dataset: SWaT
    config: scripts/configs/swat_cf_val.yaml
    input_dir: SWaT51
    entities: [swat]
    seeds: [0]
    expected_n: 51
  - dataset: SMD
    config: scripts/configs/smd_cf_val.yaml
    input_dir: SMD
    entities: [machine-1-1]
    seeds: [0]
eval_only: []
