# cfval_abl_nocstruct: derived from scripts/configs/smd_cf_val.yaml at CODE_SHA 49f630a — ONLY PICAAD.START_CLS_EPOCH=81 changed (loss ablation, js/server8).
DATA:
  NAME: SMD
  INPUT_DIR: <DATA_NPZ>/SMD
SEEDS:
- 0
- 1
- 2
- 3
TRAIN:
  BATCH_SIZE: 512
  EVAL_EVERY: 0
TEST:
  BATCH_SIZE: 512
SOLVER:
  MAX_EPOCH: 80
  BASE_LR: 0.0005
  GRADIENT_CLIP: 1.0
PICAAD:
  INTERVENTION:
    PERM_PAIRS_PER_BATCH: 0
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: false
    USE_COUNTERFACTUAL: true
    CF_TOP_K: 15
    CF_FILL_VALUE: 0.0
    SCORE_GAMMA: 1.0
  START_CLS_EPOCH: 81
EVAL:
  USE_MEDIAN_VUS_WINDOW: true
  DIAGNOSE_COMPONENTS: true
VAL:
  ENABLE: true
  FRAC: 0.2
  SAVE_EVERY_EPOCH: false
  SAVE_EVERY_N: 0
