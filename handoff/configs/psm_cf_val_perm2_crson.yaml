# cfval_abl_psmcrs — derived from scripts/configs/psm_cf_val.yaml at CODE_SHA 49f630a.
# Two factors changed vs that base, nothing else:
#   PICAAD.INTERVENTION.PERM_PAIRS_PER_BATCH = 2   (0 = cls_ref degenerates to the frozen PCMCI prior; 2 = cls_ref built from intervention effects)
#   PICAAD.START_CLS_EPOCH                   = 5  (5 = causal-structure loss active from ep5; 99999 = never, i.e. CRS loss off)
# BASE_LR is 5e-05: utils/parser.py applies _DATASET_DEFAULT_LR['PSM']=5e-5 unless SOLVER.BASE_LR is given on the CLI,
# so a YAML value cannot take effect. 5e-05 is written here to match what actually runs (and the noes repro).
DATA:
  NAME: PSM
  INPUT_DIR: <DATA_NPZ>/PSM
SEEDS:
- 0
- 1
- 2
- 3
TRAIN:
  BATCH_SIZE: 512
  EVAL_EVERY: 0
TEST:
  BATCH_SIZE: 512
SOLVER:
  MAX_EPOCH: 80
  BASE_LR: 5.0e-05
  GRADIENT_CLIP: 1.0
PICAAD:
  INTERVENTION:
    PERM_PAIRS_PER_BATCH: 2
  PRIOR:
    TYPE: pcmci
    PCMCI:
      ALPHA: 0.05
      SUBSAMPLE: 10000
  SCORING:
    CALIBRATE: false
    USE_COUNTERFACTUAL: true
    CF_TOP_K: 15
    CF_FILL_VALUE: 0.0
    SCORE_GAMMA: 1.0
  START_CLS_EPOCH: 5
EVAL:
  USE_MEDIAN_VUS_WINDOW: true
  DIAGNOSE_COMPONENTS: true
VAL:
  ENABLE: true
  FRAC: 0.2
  SAVE_EVERY_EPOCH: false
  SAVE_EVERY_N: 0
